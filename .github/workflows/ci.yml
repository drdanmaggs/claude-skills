name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hooks:
    name: Shell test matrices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify jq is available
        # The hooks degrade to a no-op without jq, which would make their
        # matrices vacuously green. Fail loudly instead.
        run: jq --version

      - name: Run every shell test matrix
        # Discovered, not enumerated. A named-step-per-test means a new test
        # file silently never runs — which is the exact failure mode these
        # hooks exist to prevent. Fails if zero are found, so a rename or a
        # bad glob can't pass as "all green".
        #
        # Covers skills/*/scripts/ too: generate_coverage.test.sh lives there,
        # and a test that only runs locally is a test that stops running.
        run: |
          shopt -s nullglob
          tests=(hooks/*.test.sh skills/*/scripts/*.test.sh)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "FAIL — no *.test.sh found; this job would be vacuously green"
            exit 1
          fi
          fail=0
          for t in "${tests[@]}"; do
            echo "== $t"
            "$t" || fail=1
          done
          exit "$fail"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck on every shell script
        # Discovered, not enumerated, and fails on zero — same reasoning as the
        # test matrices above. Enumerating directories is how
        # skills/test-coverage-retrofit sat unchecked long enough to grow a
        # command-injection bug (#10).
        run: |
          shopt -s nullglob
          scripts=(hooks/*.sh skills/*/scripts/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "FAIL — no shell scripts found; this job would be vacuously green"
            exit 1
          fi
          printf 'checking %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

  manifest:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON manifests
        run: |
          fail=0
          while IFS= read -r f; do
            if jq empty "$f" 2>/dev/null; then
              echo "ok   $f"
            else
              echo "FAIL $f"; fail=1
            fi
          done < <(find . -path ./.git -prune -o -name '*.json' -print)
          exit "$fail"

      - name: Every skill has a SKILL.md with frontmatter
        run: |
          fail=0
          for d in skills/*/; do
            f="${d}SKILL.md"
            if [ ! -f "$f" ]; then
              echo "FAIL ${d} — no SKILL.md"; fail=1; continue
            fi
            if [ "$(head -n1 "$f")" != "---" ]; then
              echo "FAIL $f — missing YAML frontmatter"; fail=1; continue
            fi
            echo "ok   $f"
          done
          exit "$fail"

      - name: Labels in skills and agents are on-canon
        # Stops the issue-creating callers drifting back into invented labels.
        # Six of the label names they used to write existed in no repo at all.
        run: ./skills/issue-labeller/scripts/verify-canon.sh
