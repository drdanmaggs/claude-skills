name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hooks:
    name: Hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify jq is available
        # The hooks degrade to a no-op without jq, which would make their
        # matrices vacuously green. Fail loudly instead.
        run: jq --version

      - name: Run every hook test matrix
        # Discovered, not enumerated. A named-step-per-test means a new test
        # file silently never runs — which is the exact failure mode these
        # hooks exist to prevent. Fails if zero are found, so a rename or a
        # bad glob can't pass as "all green".
        run: |
          shopt -s nullglob
          tests=(hooks/*.test.sh)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "FAIL — no hooks/*.test.sh found; this job would be vacuously green"
            exit 1
          fi
          fail=0
          for t in "${tests[@]}"; do
            echo "== $t"
            "$t" || fail=1
          done
          exit "$fail"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck on hooks and issue-labeller scripts
        # Not yet widened to skills/*/scripts/*.sh — test-coverage-retrofit
        # trips SC2086 on an `eval $CMD`, and fixing that needs its own change
        # with its own verification. Tracked separately.
        run: shellcheck hooks/*.sh skills/issue-labeller/scripts/*.sh

  manifest:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON manifests
        run: |
          fail=0
          while IFS= read -r f; do
            if jq empty "$f" 2>/dev/null; then
              echo "ok   $f"
            else
              echo "FAIL $f"; fail=1
            fi
          done < <(find . -path ./.git -prune -o -name '*.json' -print)
          exit "$fail"

      - name: Every skill has a SKILL.md with frontmatter
        run: |
          fail=0
          for d in skills/*/; do
            f="${d}SKILL.md"
            if [ ! -f "$f" ]; then
              echo "FAIL ${d} — no SKILL.md"; fail=1; continue
            fi
            if [ "$(head -n1 "$f")" != "---" ]; then
              echo "FAIL $f — missing YAML frontmatter"; fail=1; continue
            fi
            echo "ok   $f"
          done
          exit "$fail"

      - name: Labels in skills and agents are on-canon
        # Stops the issue-creating callers drifting back into invented labels.
        # Six of the label names they used to write existed in no repo at all.
        run: ./skills/issue-labeller/scripts/verify-canon.sh
